<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Take Exam — Apex Institute</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/layout.css">
  <link rel="stylesheet" href="../shared/css/components.css">

  <style>
    .take-wrap {
      max-width: 820px;
      margin: 0 auto;
    }
    .take-head {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: var(--sp-5);
      margin-bottom: var(--sp-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-4);
      flex-wrap: wrap;
    }
    .take-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 4px;
    }
    .take-meta {
      font-size: 13px;
      color: var(--text-dim);
    }
    .take-progress {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      background: var(--bg);
      padding: 8px 14px;
      border-radius: 100px;
    }
    .take-progress span { color: var(--text-dim); font-weight: 500; }

    .take-list { display: flex; flex-direction: column; gap: var(--sp-4); }

    .take-q {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: var(--sp-5);
      transition: border-color 200ms ease;
    }
    .take-q.answered { border-color: var(--success); }
    .take-q-head {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-3);
      margin-bottom: var(--sp-4);
    }
    .take-q-num {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
    }
    .take-q-text {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.55;
      padding-top: 3px;
    }
    .take-opts {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .take-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: all 160ms var(--ease);
      background: var(--surface);
    }
    .take-opt:hover { border-color: var(--border-strong); background: var(--bg); }
    .take-opt input { display: none; }
    .take-opt-letter {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--bg);
      color: var(--navy);
      display: grid;
      place-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 12px;
      flex-shrink: 0;
      transition: all 160ms var(--ease);
    }
    .take-opt-text { font-size: 13.5px; color: var(--text); }
    .take-opt.selected {
      border-color: var(--navy);
      background: var(--navy);
      color: #fff;
    }
    .take-opt.selected .take-opt-letter {
      background: var(--gold);
      color: var(--navy);
    }
    .take-opt.selected .take-opt-text { color: #fff; font-weight: 500; }

    .take-submit {
      margin-top: var(--sp-6);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: var(--sp-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-4);
      flex-wrap: wrap;
      position: sticky;
      bottom: var(--sp-5);
      box-shadow: var(--shadow-md);
    }
    .take-submit-info {
      font-size: 13.5px;
      color: var(--text-dim);
    }
    .take-submit-info strong { color: var(--navy); }
    .btn-submit {
      padding: 11px 22px;
      border-radius: var(--r-md);
      border: 0;
      background: var(--navy);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 160ms var(--ease);
    }
    .btn-submit:hover { background: var(--navy-700); }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

    /* Result screen */
    .result-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: var(--sp-6);
      text-align: center;
      margin-bottom: var(--sp-5);
    }
    .result-grade {
      width: 110px; height: 110px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto var(--sp-4);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 48px;
      font-weight: 800;
    }
    .result-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 6px;
    }
    .result-sub {
      font-size: 14px;
      color: var(--text-dim);
    }
    .result-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-3);
      margin-top: var(--sp-5);
    }
    .result-stat {
      padding: var(--sp-4);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      text-align: center;
    }
    .result-stat .rs-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .result-stat .rs-value {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--navy);
    }
    .result-stat.correct   .rs-value { color: var(--success); }
    .result-stat.incorrect .rs-value { color: var(--danger); }
    .result-stat.blank     .rs-value { color: var(--text-faint); }

    .result-actions {
      display: flex;
      gap: var(--sp-3);
      justify-content: center;
      margin-top: var(--sp-5);
    }
    .btn-outline {
      padding: 10px 20px;
      border-radius: var(--r-md);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--navy);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-outline:hover { background: var(--bg); }
    .btn-primary-solid {
      padding: 10px 20px;
      border-radius: var(--r-md);
      border: 1px solid var(--navy);
      background: var(--navy);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary-solid:hover { background: var(--navy-700); border-color: var(--navy-700); }

    .warning-banner {
      padding: var(--sp-4) var(--sp-5);
      background: var(--gold-soft);
      border-left: 3px solid var(--gold);
      border-radius: var(--r-md);
      color: #7A5B10;
      font-size: 13.5px;
      line-height: 1.5;
      margin-bottom: var(--sp-5);
    }
  </style>
</head>
<body>

<script src="../shared/js/utils.js"></script>
<script src="../shared/js/icons.js"></script>
<script src="../shared/js/shell.js"></script>

<script>
const TOKEN = localStorage.getItem('apex_token');
if (!TOKEN) location.href = '../login.html';
const API_BASE = 'http://localhost:8080';

const params = new URLSearchParams(location.search);
const EXAM_ID = parseInt(params.get('examId') || '0', 10);
if (!EXAM_ID) location.href = 'exams.html';

Shell.render({
  active: 'exams',
  role: 'STUDENT',
  content: '<div class="loading">Loading exam…</div>',
});

let QUESTIONS = [];
let ANSWERS = {}; // questionId -> "A"|"B"|"C"|"D"

(async function boot() {
  try {
    const res = await fetch(`${API_BASE}/api/student/exams/${EXAM_ID}/take`, {
      headers: { 'Authorization': 'Bearer ' + TOKEN },
    });

    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem('apex_token');
      localStorage.removeItem('apex_user');
      location.href = '../login.html';
      return;
    }

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      document.getElementById('app-main').innerHTML = `
        <div class="take-wrap">
          <div class="warning-banner" style="background: var(--danger-bg); border-left-color: var(--danger); color: var(--danger);">
            ${Utils.esc(data.message || 'Could not load this exam.')}
          </div>
          <a class="btn-outline" href="exams.html">← Back to Exams</a>
        </div>`;
      return;
    }

    QUESTIONS = await res.json();
    renderPage();

  } catch (err) {
    document.getElementById('app-main').innerHTML = `
      <div class="take-wrap">
        <div class="warning-banner" style="background: var(--danger-bg); border-left-color: var(--danger); color: var(--danger);">
          Network error: ${Utils.esc(err.message)}
        </div>
      </div>`;
  }
})();

function renderPage() {
  const answered = Object.keys(ANSWERS).length;

  document.getElementById('app-main').innerHTML = `
    <div class="take-wrap">
      <header class="page-header" style="margin-bottom: var(--sp-5);">
        <div>
          <div class="page-eyebrow">Exam in progress</div>
          <h1 class="page-title">Answer all questions</h1>
          <p class="page-subtitle">Your score is calculated as soon as you submit.</p>
        </div>
      </header>

      <div class="warning-banner">
        <strong>Note:</strong> You can take this exam once. There is no time limit here, but make sure
        you're ready — you can't go back after submitting.
      </div>

      <div class="take-list" id="take-list">
        ${QUESTIONS.map((q, i) => renderQuestion(q, i)).join('')}
      </div>

      <div class="take-submit">
        <div class="take-submit-info">
          Answered <strong id="answered-count">${answered}</strong> of
          <strong>${QUESTIONS.length}</strong> questions
        </div>
        <button class="btn-submit" id="submit-btn">Submit Exam</button>
      </div>
    </div>
  `;

  wireQuestions();
  wireSubmit();
}

function renderQuestion(q, i) {
  return `
    <div class="take-q" data-qid="${q.id}">
      <div class="take-q-head">
        <div class="take-q-num">${i + 1}</div>
        <div class="take-q-text">${Utils.esc(q.text)}</div>
      </div>
      <div class="take-opts">
        ${['A','B','C','D'].map(L => `
          <label class="take-opt ${ANSWERS[q.id] === L ? 'selected' : ''}" data-letter="${L}">
            <input type="radio" name="q-${q.id}" value="${L}" ${ANSWERS[q.id] === L ? 'checked' : ''}>
            <span class="take-opt-letter">${L}</span>
            <span class="take-opt-text">${Utils.esc(q['option' + L])}</span>
          </label>`).join('')}
      </div>
    </div>`;
}

function wireQuestions() {
  document.querySelectorAll('.take-q').forEach(qEl => {
    const qid = parseInt(qEl.dataset.qid, 10);
    qEl.querySelectorAll('.take-opt').forEach(optEl => {
      optEl.addEventListener('click', () => {
        const letter = optEl.dataset.letter;
        ANSWERS[qid] = letter;

        qEl.querySelectorAll('.take-opt').forEach(o =>
          o.classList.toggle('selected', o === optEl));
        qEl.classList.add('answered');

        document.getElementById('answered-count').textContent = Object.keys(ANSWERS).length;
      });
    });
  });
}

function wireSubmit() {
  document.getElementById('submit-btn').onclick = async () => {
    const missing = QUESTIONS.length - Object.keys(ANSWERS).length;
    const warning = missing > 0
      ? `${missing} question${missing !== 1 ? 's are' : ' is'} still unanswered. Submit anyway?`
      : 'Submit your exam? You cannot change your answers after this.';

    if (!confirm(warning)) return;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    const payload = {
      answers: QUESTIONS.map(q => ({
        questionId: q.id,
        choice: ANSWERS[q.id] || null,
      })),
    };

    try {
      const res = await fetch(`${API_BASE}/api/student/exams/${EXAM_ID}/submit`, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + TOKEN,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(payload),
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        alert(data.message || 'Submit failed');
        btn.disabled = false;
        btn.textContent = 'Submit Exam';
        return;
      }

      renderResult(data);

    } catch (err) {
      alert('Network error: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Submit Exam';
    }
  };
}

function renderResult(r) {
  const color = {
    A: { bg: '#E7F4EE', fg: '#198754' },
    B: { bg: '#EAF1FE', fg: '#175CD3' },
    C: { bg: '#FEF3E7', fg: '#B54708' },
    S: { bg: '#FBF3DC', fg: '#8F6B0F' },
    F: { bg: '#FEECEC', fg: '#B42318' },
  }[r.grade] || { bg: '#E4E7EC', fg: '#667085' };

  const message = r.percentage >= 75 ? 'Excellent work.'
    : r.percentage >= 65 ? 'Very good.'
    : r.percentage >= 55 ? 'Good effort.'
    : r.percentage >= 35 ? 'Passed.'
    : 'Keep trying.';

  document.getElementById('app-main').innerHTML = `
    <div class="take-wrap">
      <div class="result-hero">
        <div class="result-grade" style="background:${color.bg}; color:${color.fg};">
          ${r.grade}
        </div>
        <div class="result-title">${message}</div>
        <div class="result-sub">
          You scored ${formatNum(r.marksObtained)} / ${r.totalMarks} (${r.percentage}%)
        </div>

        <div class="result-stats">
          <div class="result-stat correct">
            <div class="rs-label">Correct</div>
            <div class="rs-value">${r.correct}</div>
          </div>
          <div class="result-stat incorrect">
            <div class="rs-label">Incorrect</div>
            <div class="rs-value">${r.incorrect}</div>
          </div>
          <div class="result-stat blank">
            <div class="rs-label">Unanswered</div>
            <div class="rs-value">${r.unanswered}</div>
          </div>
          <div class="result-stat">
            <div class="rs-label">Total</div>
            <div class="rs-value">${r.totalQuestions}</div>
          </div>
        </div>

        <div class="result-actions">
          <a class="btn-outline" href="exams.html">Back to Exams</a>
          <a class="btn-primary-solid" href="exams.html">See My Result</a>
        </div>
      </div>
    </div>`;
}

function formatNum(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}
</script>
</body>
</html>
