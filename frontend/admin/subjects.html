<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subjects — Apex Institute</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/layout.css">
  <link rel="stylesheet" href="../shared/css/components.css">

  <style>
    .subj-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-4);
    }
    @media (max-width: 1000px) { .subj-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 700px) { .subj-grid { grid-template-columns: 1fr; } }

    .subj-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: var(--sp-5);
      box-shadow: var(--shadow-xs);
      display: flex; flex-direction: column; gap: var(--sp-4);
      transition: all var(--dur) var(--ease);
      position: relative;
    }
    .subj-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }

    .subj-head {
      display: flex; align-items: center; gap: var(--sp-3);
    }
    .subj-dot {
      width: 42px; height: 42px; border-radius: var(--r-md);
      display: grid; place-items: center;
      color: #fff; font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800; font-size: 16px;
      flex-shrink: 0;
    }
    .subj-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px; font-weight: 800;
      color: var(--navy); letter-spacing: -0.015em;
    }
    .subj-meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }

    .subj-stats {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: var(--sp-3);
      padding-top: var(--sp-3);
      border-top: 1px solid var(--border);
    }
    .subj-stat-label {
      font-size: 10.5px; font-weight: 700;
      color: var(--text-dim); text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 4px;
    }
    .subj-stat-value {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px; font-weight: 800;
      color: var(--navy); letter-spacing: -0.02em; line-height: 1;
    }

    .subj-delete {
      position: absolute; top: var(--sp-3); right: var(--sp-3);
      width: 28px; height: 28px; border-radius: var(--r-sm);
      color: var(--text-faint);
      display: grid; place-items: center;
      transition: all var(--dur-fast) var(--ease);
      cursor: pointer; background: transparent; border: none;
    }
    .subj-delete:hover { background: var(--danger-bg); color: var(--danger); }
    .subj-delete svg { width: 14px; height: 14px; }

    .subj-add-card {
      background: var(--surface);
      border: 2px dashed var(--border-strong);
      border-radius: var(--r-lg);
      padding: var(--sp-5);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: var(--sp-3);
      min-height: 160px;
      cursor: pointer;
      transition: all var(--dur) var(--ease);
      color: var(--text-dim);
    }
    .subj-add-card:hover {
      border-color: var(--navy); color: var(--navy);
      background: var(--surface-alt);
    }
    .subj-add-card svg { width: 32px; height: 32px; }
    .subj-add-card span {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px; font-weight: 700;
    }
  </style>
</head>
<body>

<script src="../shared/js/utils.js"></script>
<script src="../shared/js/icons.js"></script>
<script src="../shared/js/shell.js"></script>
<script src="../shared/js/modal.js"></script>

<script>
const TOKEN = localStorage.getItem('apex_token');
if (!TOKEN) location.href = '../login.html';
const API_BASE = 'http://localhost:8080';

let DATA = null;

Shell.render({
  active: 'subjects',
  role: 'ADMIN',
  content: '<div class="loading">Loading subjects…</div>',
});

(async function boot() {
  try {
    const res = await fetch(API_BASE + '/api/admin/subjects', {
      headers: { 'Authorization': 'Bearer ' + TOKEN },
    });
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem('apex_token');
      localStorage.removeItem('apex_user');
      location.href = '../login.html';
      return;
    }
    if (!res.ok) throw new Error('Server returned ' + res.status);
    DATA = await res.json();
    rerender();
  } catch (err) {
    document.getElementById('app-main').innerHTML = `
      <div class="error-box">
        <h2>Could not load subjects</h2>
        <p style="color:var(--text-dim); margin:8px 0 16px;">${Utils.esc(err.message)}</p>
        <button class="btn btn-primary" onclick="location.reload()">Try again</button>
      </div>`;
  }
})();

const COLORS = ['#14213D','#175CD3','#6941C6','#C11574','#198754','#0E9384','#E9B949','#B54708'];
function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % COLORS.length;
  return COLORS[h];
}

function rerender() {
  document.getElementById('app-main').innerHTML = renderPage();
  wireAll();
}

function renderPage() {
  return `
    <header class="page-header">
      <div>
        <div class="page-eyebrow">Academics</div>
        <h1 class="page-title">Subjects</h1>
        <p class="page-subtitle">
          ${DATA.total} subject${DATA.total !== 1 ? 's' : ''} ·
          ${DATA.inUse} in use
        </p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" id="header-add">${Icon.book()} New Subject</button>
      </div>
    </header>

    <div class="subj-grid" id="grid-host">${renderGrid()}</div>
  `;
}

function renderGrid() {
  const cards = DATA.subjects.map(renderCard).join('');
  return cards + renderAddCard();
}

function renderCard(s) {
  const color = colorFor(s.name);
  const initial = s.name.charAt(0).toUpperCase();
  return `
    <div class="subj-card" data-sid="${s.id}">
      <button class="subj-delete" data-delete="${s.id}" title="Delete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
      <div class="subj-head">
        <div class="subj-dot" style="background:${color};">${initial}</div>
        <div>
          <div class="subj-name">${Utils.esc(s.name)}</div>
          <div class="subj-meta">Subject code: SUB-${String(s.id).padStart(3, '0')}</div>
        </div>
      </div>
      <div class="subj-stats">
        <div>
          <div class="subj-stat-label">Classes</div>
          <div class="subj-stat-value">${s.classCount}</div>
        </div>
        <div>
          <div class="subj-stat-label">Grades</div>
          <div class="subj-stat-value">${s.gradeCount > 0 ? s.gradeCount : '—'}</div>
        </div>
      </div>
    </div>`;
}

function renderAddCard() {
  return `
    <div class="subj-add-card" id="add-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span>Add Subject</span>
    </div>`;
}

function openAddModal() {
  const body = `
    <div class="form-field">
      <label>Subject Name</label>
      <input type="text" id="as-name" placeholder="e.g. Geography" required>
      <div class="form-help">Appears in class names, timetables, and exam labels.</div>
    </div>
    <div class="form-actions" style="margin-top: var(--sp-5);">
      <button class="btn btn-ghost" data-cancel>Cancel</button>
      <button class="btn btn-primary" id="as-submit">Add Subject</button>
    </div>
  `;
  const m = Modal.open({ title: 'New Subject', body, size: 'sm' });

  m.el.querySelector('[data-cancel]').onclick = () => m.close();
  m.el.querySelector('#as-submit').onclick = async () => {
    const name = m.el.querySelector('#as-name').value.trim();
    if (!name) return showToast('Please enter a subject name');

    try {
      const res = await fetch(API_BASE + '/api/admin/subjects', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { showToast(data.message || 'Create failed'); return; }
      m.close();
      await reload();
      showToast(`${name} added`);
    } catch (err) { showToast('Network error: ' + err.message); }
  };
}

function openDeleteModal(id) {
  const s = DATA.subjects.find(x => x.id === id);
  if (!s) return;
  const body = `
    <p style="font-size:13.5px; color:var(--text-dim); line-height:1.55; margin-bottom:var(--sp-4);">
      Delete <strong style="color:var(--navy);">${Utils.esc(s.name)}</strong>?
      ${s.classCount > 0
        ? `<br><span style="color:var(--warning);">Warning: ${s.classCount} class${s.classCount > 1 ? 'es' : ''} currently use this subject.</span>`
        : ''}
    </p>
    <div class="form-actions" style="margin-top:0;">
      <button class="btn btn-ghost" data-cancel>Cancel</button>
      <button class="btn" data-confirm style="background:var(--danger); border-color:var(--danger); color:#fff;">Delete</button>
    </div>`;
  const m = Modal.open({ title: 'Delete Subject', body, size: 'sm' });

  m.el.querySelector('[data-cancel]').onclick = () => m.close();
  m.el.querySelector('[data-confirm]').onclick = async () => {
    try {
      const res = await fetch(`${API_BASE}/api/admin/subjects/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + TOKEN },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { showToast(data.message || 'Delete failed'); return; }
      m.close();
      await reload();
      showToast(`${s.name} deleted`);
    } catch (err) { showToast('Network error: ' + err.message); }
  };
}

async function reload() {
  const res = await fetch(API_BASE + '/api/admin/subjects', {
    headers: { 'Authorization': 'Bearer ' + TOKEN },
  });
  if (res.ok) {
    DATA = await res.json();
    rerender();
  }
}

function wireAll() {
  document.getElementById('header-add').onclick = openAddModal;
  document.getElementById('add-card')?.addEventListener('click', openAddModal);
  document.querySelectorAll('[data-delete]').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); openDeleteModal(parseInt(b.dataset.delete, 10)); };
  });
}

function showToast(message) {
  let host = document.querySelector('.toast-host');
  if (!host) { host = document.createElement('div'); host.className = 'toast-host'; document.body.appendChild(host); }
  const el = document.createElement('div');
  el.className = 'toast toast-success';
  el.textContent = message;
  host.appendChild(el);
  void el.offsetWidth; el.classList.add('toast-in');
  setTimeout(() => { el.classList.remove('toast-in'); setTimeout(() => el.remove(), 200); }, 3000);
}
</script>
</body>
</html>
